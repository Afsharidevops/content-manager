# Editorial policy for the LocalLab daily content pipeline.
# Owner-editable. No code change required to adjust any value below.
# All static content in this repository is English-only; Persian copy is
# produced at runtime by the writer step, never stored in this repository.
schema_version: 1

# Daily cadence and limits (decided values).
pipeline:
  timezone: "Asia/Tehran"
  # Built-in daily proposal pass. Set false when the scheduled routines
  # replace it; routines keep their own cadence either way.
  daily_enabled: true
  daily_proposal_time: "08:00"
  min_candidates: 5
  max_candidates: 5
  max_approved_per_day: 3
  max_consecutive_same_category: 3

# Scheduled routines: research -> draft -> media -> queue.
# Each enabled routine runs one pass per cadence period, drafts the ranked
# candidates, optionally attaches an AI image, and drops the result into the
# Telegram approval queue. Give every platform its own cadence by adding one
# routine per platform, and add several routines with different ids and times
# to propose more than once per day; the on-demand and daily-proposal paths
# are unchanged.
# Shape (all keys except id are optional):
#
#   routines:
#     - id: instagram-daily          # unique key used in state and logs
#       platform: instagram          # label shown in /status and on drafts
#       enabled: true
#       cadence: daily               # daily | weekly
#       time: "10:00"                # local time in pipeline.timezone
#       weekday: monday              # weekly cadence only
#       count: 1                     # drafts queued per run
#       media: auto                  # auto (AI image) | ask (media question) | none
routines: []

# Deduplication tuning.
dedupe:
  title_similarity_threshold: 0.90

# Behavior when the operator sends a link directly to the Content Bot.
# Both keys are owner-editable; no code change required.
on_demand:
  # false (default): operator-sent links skip the freshness window below.
  # true:            apply freshness_hours to operator-sent links as well.
  enforce_freshness: false
  # true (default):  operator approvals never hit max_approved_per_day.
  # false:           operator approvals count toward the daily limit too.
  unlimited_approvals: true

# Reject items older than this window at discovery time (hours).
freshness_hours: 72

# Deterministic candidate score (0-100). Weighted sum, then penalties applied.
scoring:
  weights:
    local_lab_relevance: 30
    practical_usefulness: 20
    freshness: 15
    source_trust: 15
    novelty: 10
    visual_fit: 5
    iranian_audience: 5
  penalties:
    duplicate_topic: -25
    pure_marketing: -30
    no_primary_source: -40
    too_niche: -15
    unsafe_guidance: -100

# Deterministic exclusions applied before any shortlist is built.
exclusions:
  # Exact host or suffix match against the canonical URL host.
  blocked_domains: []

  # Plain substrings matched against the normalized title.
  low_value_title_keywords:
    - "limited time offer"
    - "buy now"
    - "get rich"
    - "earn money fast"
    - "discount code"
    - "best deal"
    - "free money"
    - "click here"

  # Topics that are never proposed, whatever the source.
  # Sources are English-first, so English blocklists cover the MVP.
  political_terms:
    - election
    - elections
    - electoral
    - vote
    - voting
    - ballot
    - referendum
    - parliament
    - parliamentary
    - congress
    - congressional
    - senate
    - senator
    - president
    - presidential
    - prime minister
    - impeachment
    - coup
    - regime change
    - sanctions
    - diplomat
    - diplomacy
    - geopolitics
    - geopolitical
    - government shutdown

  religious_terms:
    - fatwa
    - jihad
    - blasphemy

  controversial_terms:
    - "nsfw"
    - "adult content"
    - gambling
    - casino
    - "pump and dump"
    - "pyramid scheme"
    - "get rich quick"

# Default publishing targets. A draft may carry its own targets:
#   targets: [linkedin_personal, linkedin_company, bale]
# written as platform_account, or as {platform: linkedin, account: personal}.
# Targets name the automatic channel adapters (bale, eitaa, one key per
# LinkedIn account); Telegram and Instagram keep their own approve-time paths.
# A draft without targets falls back to the list below; with no list at all
# the bot publishes to every automatic channel it has configured (the
# "All targets" button). Targets are documented in docs/LINKEDIN-SETUP.md.
publishing:
  targets: []

# Tone profiles for per-destination adaptation. Keys ship with the bot:
#   linkedin_personal  first person, technical, opinionated, founder voice
#   linkedin_company   educational, neutral, brand voice
#   telegram           concise, news-shaped
# A LinkedIn account adapts through linkedin_company when its type is
# organization and through linkedin_personal otherwise. Override a profile
# here (style, max_chars, enabled, or another built-in template), add your own
# key, or remove one with null. The rewrite prompt itself can be replaced by a
# file named <tone>.md or <tone>.txt in prompt-templates/ inside this policy
# directory; CONTENT_ADAPT_ENABLED=false publishes the draft text unchanged.
# Shape:
#
#   tones:
#     linkedin_personal:
#       style: [first_person, technical, opinionated, founder_voice]
#       max_chars: 2800
#       template: linkedin_personal
#       enabled: true
tones: {}

# Platforms that need a manual upload step. Used only when the operator sets
# CONTENT_PLATFORMS_ENABLED=true; each key then becomes a button under
# "More platforms..." on draft previews and the bot sends a copy-ready
# package (title, description, hashtags, upload link) plus the stored media
# file. Telegram and Instagram publish through their APIs and are not listed
# here; Bale and Eitaa below are automatic, and LinkedIn switches to one
# automatic profile per configured account. Override any value below, add a
# new platform key, or set a key to null to hide its button; no code change is
# required.
platforms:
  youtube:
    label: "YouTube"
    upload_url: "https://studio.youtube.com/"
    title_limit: 100
    description_limit: 5000
    note: "Vertical clips publish as Shorts; keep the title under 100 characters."
    hashtags: []
  aparat:
    label: "Aparat"
    upload_url: "https://www.aparat.com/upload"
    title_limit: 100
    description_limit: 4000
    note: "Upload the video file and paste the title and description."
    hashtags: []
  bale:
    label: "Bale"
    upload_url: "https://bale.ai/"
    title_limit: 100
    description_limit: 4000
    note: "Published automatically through the Bale bot API when CONTENT_BALE_TOKEN and CONTENT_BALE_CHAT_ID are set."
    mode: "auto"
    channel: "bale"
    hashtags: []
  eitaa:
    label: "Eitaa"
    upload_url: "https://eitaa.com/"
    title_limit: 100
    description_limit: 4000
    note: "Published automatically through the EitaaYar bot API when CONTENT_EITAA_TOKEN and CONTENT_EITAA_CHAT_ID are set."
    mode: "auto"
    channel: "eitaa"
    hashtags: []
  linkedin:
    label: "LinkedIn"
    upload_url: "https://www.linkedin.com/feed/"
    title_limit: 120
    description_limit: 2900
    note: "Copy-ready package, kept beside the automatic LinkedIn accounts for hand-offs the REST API cannot do (video posts, for example); set linkedin: null here to hide it once accounts are configured (docs/LINKEDIN-SETUP.md)."
    hashtags: []
