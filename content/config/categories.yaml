# Content categories for the LocalLab daily content pipeline.
# Build-in-Public / LocalLab-stack update category is intentionally disabled.
# weight: relative share of the daily mix; sum of weights should equal 100.
# English-only in the repository. Persian display labels are produced at
# runtime by the writer step from these canonical category ids/labels.
categories:
