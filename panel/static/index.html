<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Content Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form class="card loginbox" id="login-form">
    <div class="brandline"><span class="mark" aria-hidden="true">
  <svg viewBox="0 0 64 64" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ll-grad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#35e6ff"/>
        <stop offset=".42" stop-color="#4f8bff"/>
        <stop offset=".72" stop-color="#7b5cff"/>
        <stop offset="1" stop-color="#d94dff"/>
      </linearGradient>
    </defs>
    <path d="M32 3.5 57.2 18v28L32 60.5 6.8 46V18z" stroke="url(#ll-grad)" stroke-width="3.1" stroke-linejoin="round"/>
    <path d="M32 20.5 43.5 27v13L32 46.5 20.5 40V27z" stroke="url(#ll-grad)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 20.5V39M20.5 27 32 33.8 43.5 27" stroke="url(#ll-grad)" stroke-width="1.7" opacity=".85"/>
  </svg>
</span><div><strong>Content Console</strong><small>LocalLab</small></div></div>
    <p class="muted">Paste the operator token from <code>./manage.sh panel token</code>.</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="Panel token" required>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<div id="shell" class="layout hidden">
  <aside class="side">
    <div class="brandline"><span class="mark" aria-hidden="true">
  <svg viewBox="0 0 64 64" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ll-grad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#35e6ff"/>
        <stop offset=".42" stop-color="#4f8bff"/>
        <stop offset=".72" stop-color="#7b5cff"/>
        <stop offset="1" stop-color="#d94dff"/>
      </linearGradient>
    </defs>
    <path d="M32 3.5 57.2 18v28L32 60.5 6.8 46V18z" stroke="url(#ll-grad)" stroke-width="3.1" stroke-linejoin="round"/>
    <path d="M32 20.5 43.5 27v13L32 46.5 20.5 40V27z" stroke="url(#ll-grad)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M32 20.5V39M20.5 27 32 33.8 43.5 27" stroke="url(#ll-grad)" stroke-width="1.7" opacity=".85"/>
  </svg>
</span><div><strong>Content Console</strong><small>LocalLab</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div id="session-note" class="muted small"></div>
      <button class="btn ghost" id="logout" type="button">Sign out</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div>
        <div class="eyebrow" id="eyebrow">Overview</div>
        <h1 id="title">Stack status</h1>
        <div class="muted" id="hint"></div>
      </div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </header>
    <div id="banner"></div>
    <div id="page"></div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
