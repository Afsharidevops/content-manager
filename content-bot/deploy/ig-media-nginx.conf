# Static host for Instagram media downloads.
#
# Replaces the stock nginx default server so the public tunnel exposes only the
# media subtree: directory listings stay off and every other path answers 404
# instead of the nginx welcome page.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    location = /media {
        return 404;
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }
}
