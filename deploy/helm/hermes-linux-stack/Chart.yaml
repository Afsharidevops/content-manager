apiVersion: v2
name: hermes-linux-stack
version: 0.6.4
appVersion: "0.5.9"
description: Content Manager on the Hermes Linux Stack v0.5.9 platform - Smart Router HA core with PostgreSQL and Redis, an optional in-cluster 9router or OmniRoute gateway, and optional Content Manager components
type: application
keywords:
  - hermes
  - smart-router
  - content-manager
  - telegram
  - instagram
home: https://github.com/Afsharidevops/content-manager
sources:
  - https://github.com/Afsharidevops/content-manager
maintainers:
  - name: Afshari
    url: https://github.com/Afsharidevops
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/changes: |
    - The Aparat uploader of Content Bot 0.4.2 follows the web uploader
      request, retries a failed chunk, and accepts a thumbnail and a duration
    - Aparat video publishing in Content Bot 0.4.1, on demand and video-only
    - Scheduled proposals of the Content Bot now carry the media question,
      and the built-in daily pass can be switched off for routine-only stacks
    - Media Studio 0.4.0 adds the api-video driver for video generation over
      an OpenAI-compatible video API
    - LinkedIn publishing, social accounts, and per-destination adaptation in
      Content Bot 0.4.0
    - Optional in-cluster 9router/OmniRoute upstream
    - Optional Content Bot, panel, Media Studio, and media file server
    - Generic ingress template for the whole stack
    - Fixed the router PostgreSQL and Redis URLs so the chart renders
