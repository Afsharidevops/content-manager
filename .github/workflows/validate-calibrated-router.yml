name: validate-calibrated-router
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r smart-router/requirements-dev.txt pyyaml
      - run: ./tests/smoke.sh
