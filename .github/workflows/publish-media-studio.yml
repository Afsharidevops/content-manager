name: Publish Media Studio

on:
  push:
    branches:
      - main
    paths:
      - 'media-studio/**'
      - 'extensions/**'
      - '.github/workflows/publish-media-studio.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-studio-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub-release
    timeout-minutes: 60
    env:
      IMAGE_VERSION: 0.5.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate image version
        id: release
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          version="${IMAGE_VERSION}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Invalid semantic version: %s\n' "$version" >&2
            exit 2
          }

          if [[ -z "${DOCKERHUB_USERNAME:-}" ]]; then
            echo "Repository variable DOCKERHUB_USERNAME is required." >&2
            exit 2
          fi

          image="${DOCKERHUB_USERNAME}/media-studio"
          base_image="${DOCKERHUB_USERNAME}/media-studio-base"
          {
            echo "value=$version"
            echo "image=$image"
            echo "base_image=$base_image"
            echo 'tags<<EOF'
            echo "$image:$version"
            if [[ "$version" != *-* ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
            echo 'base_tags<<EOF'
            echo "$base_image:$version"
            if [[ "$version" != *-* ]]; then
              echo "$base_image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect base image changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          printf '%s\n' "$changed"

          if grep -Eq '^(media-studio/Dockerfile\.base|media-studio/requirements\.txt|\.github/workflows/publish-media-studio\.yml)$' <<<"$changed"; then
            echo "base=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Media Studio
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/media-studio-venv
          /tmp/media-studio-venv/bin/pip install --quiet -r media-studio/requirements.txt
          PYTHONPATH=$PWD/media-studio /tmp/media-studio-venv/bin/python -m unittest discover -s media-studio/tests -v

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform base image
        if: steps.changes.outputs.base == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: media-studio/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.base_tags }}
          cache-from: type=gha,scope=media-studio-base
          cache-to: type=gha,mode=max,scope=media-studio-base

      - name: Build and push multi-platform app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: media-studio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            MEDIA_STUDIO_BASE_IMAGE=${{ steps.release.outputs.base_image }}:${{ steps.release.outputs.value }}
          cache-from: type=gha,scope=media-studio-app
          cache-to: type=gha,mode=max,scope=media-studio-app

      - name: Verify published multi-platform manifest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.value }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$IMAGE:$VERSION")"
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
