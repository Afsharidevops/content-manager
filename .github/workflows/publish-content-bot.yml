name: Publish Content Bot

on:
  push:
    branches:
      - main
    paths:
      - 'content-bot/**'
      - 'content/content_pipeline/**'
      - '.github/workflows/publish-content-bot.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-bot-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: dockerhub-release
    timeout-minutes: 45
    env:
      IMAGE_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate image version
        id: release
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          version="${IMAGE_VERSION}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Invalid semantic version: %s\n' "$version" >&2
            exit 2
          }

          if [[ -z "${DOCKERHUB_USERNAME:-}" ]]; then
            echo "Repository variable DOCKERHUB_USERNAME is required." >&2
            exit 2
          fi

          image="${DOCKERHUB_USERNAME}/content-bot"
          {
            echo "value=$version"
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:$version"
            if [[ "$version" != *-* ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test Content Bot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/content-bot-venv
          /tmp/content-bot-venv/bin/pip install -e content[dev]
          PYTHONPATH=$PWD/content:$PWD/content-bot /tmp/content-bot-venv/bin/pytest -q content/tests
          PYTHONPATH=$PWD/content:$PWD/content-bot /tmp/content-bot-venv/bin/python -m unittest discover -s content-bot/tests

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: content-bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release.outputs.tags }}

      - name: Verify published multi-platform manifest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.value }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$IMAGE:$VERSION")"
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<<"$inspect"
          grep -q 'linux/arm64' <<<"$inspect"
