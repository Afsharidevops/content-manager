name: v0.5.7 Platform CI
on:
  push:
    branches: [main, hermes-omniroute-linux-stack]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-router-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Smart Router test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './smart-router[dev]'
      - name: Unit and platform regressions
        working-directory: smart-router
        run: pytest -q
      - name: Compile and shell validation
        run: |
          python -m compileall -q smart-router/src/smart_router scripts/load-test-v0.5.7.py
          bash -n install.sh manage.sh scripts/ha-smoke-v0.5.7.sh
          python scripts/load-test-v0.5.7.py --help >/dev/null
