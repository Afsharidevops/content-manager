events {}
http {
  upstream hermes_router {
    least_conn;
    server router-a:8080 max_fails=2 fail_timeout=10s;
    server router-b:8080 max_fails=2 fail_timeout=10s;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://hermes_router;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }
  }
}
